title: AIWall Cost Threshold Blocked
id: d1ba6463-2c5d-41dd-ac8f-9421b46bdee8
status: experimental
description: |
  Detects when AIWall blocks a request that exceeds a configured estimated-cost
  threshold (reason=cost-threshold). Mirrors Wazuh rule 100212.
references:
  - https://github.com/MohsenBah/AIWall-detections
  - https://github.com/MohsenBah/AIWall/blob/main/docs/configuration.md
author: AIWall
date: 2026-08-08
tags:
  - attack.impact
logsource:
  product: aiwall
  service: audit
  definition: 'AIWall aiwall.audit.v1 JSON Lines export'
detection:
  selection:
    schema: 'aiwall.audit.v1'
    decision: 'block'
    reason: 'cost-threshold'
  condition: selection
falsepositives:
  - Load tests that intentionally exceed cost policies
level: medium
