title: AIWall Cost Control Blocked
id: d1ba6463-2c5d-41dd-ac8f-9421b46bdee8
status: experimental
description: |
  Detects when AIWall blocks a request on a cost control. Two reasons qualify:
  cost-threshold (a single request over a `when: estimated_cost > N` policy)
  and cost-budget (a rolling day/week/month spend cap). Mirrors Wazuh 107212.
references:
  - https://github.com/MohsenBahremani/AIWall-detections
  - https://github.com/MohsenBahremani/AIWall/blob/main/docs/configuration.md
author: AIWall
date: 2026-08-08
tags:
  - attack.impact
  - atlas.aml.t0034
logsource:
  product: aiwall
  service: audit
  definition: 'AIWall aiwall.audit.v1 JSON Lines export'
detection:
  selection:
    schema: 'aiwall.audit.v1'
    decision: 'block'
    reason:
      - 'cost-threshold'
      - 'cost-budget'
  condition: selection
falsepositives:
  - Load tests that intentionally exceed cost policies
level: medium
