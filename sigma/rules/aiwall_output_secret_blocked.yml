title: AIWall Output Secret Blocked
id: 2f8d1b44-9c70-4e31-a5d6-6b0c3e8f1a27
status: experimental
description: |
  Detects when AIWall blocks a secret found in a model reply
  (reason=output-secret-detected). Mirrors Wazuh rule 107221.
references:
  - https://github.com/MohsenBahremani/AIWall-detections
  - https://github.com/MohsenBahremani/AIWall/blob/main/docs/secret-scanning.md
author: AIWall
date: 2026-09-27
tags:
  - attack.exfiltration
  - atlas.aml.t0057
logsource:
  product: aiwall
  service: audit
  definition: 'AIWall aiwall.audit.v1 JSON Lines export'
detection:
  selection:
    schema: 'aiwall.audit.v1'
    decision: 'block'
    reason: 'output-secret-detected'
  condition: selection
falsepositives:
  - Scanner self-tests that echo synthetic keys in completions
level: high
