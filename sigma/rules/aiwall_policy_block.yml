title: AIWall Content Policy Blocked
id: 28e8e2a2-b84b-49d9-a146-fb58a2868943
status: experimental
description: |
  Detects when AIWall blocks a request by content/category policy
  (reason=category-blocked). Mirrors Wazuh rule 100211.
references:
  - https://github.com/MohsenBah/AIWall-detections
  - https://github.com/MohsenBah/AIWall/blob/main/docs/family-mode.md
author: AIWall
date: 2026-08-08
tags:
  - attack.impact
logsource:
  product: aiwall
  service: audit
  definition: 'AIWall aiwall.audit.v1 JSON Lines export'
detection:
  selection:
    schema: 'aiwall.audit.v1'
    decision: 'block'
    reason: 'category-blocked'
  condition: selection
falsepositives:
  - Expected blocks during family-mode policy testing
level: medium
