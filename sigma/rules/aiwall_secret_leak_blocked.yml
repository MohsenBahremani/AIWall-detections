title: AIWall Secret Leak Blocked
id: bf59a159-0ca8-4226-a13f-c564b3513dff
status: experimental
description: |
  Detects when AIWall blocks a request because a secret was detected in the
  outbound prompt (reason=secret-detected). Mirrors Wazuh rule 100210.
references:
  - https://github.com/MohsenBah/AIWall-detections
  - https://github.com/MohsenBah/AIWall/blob/main/docs/audit-export.md
author: AIWall
date: 2026-08-08
tags:
  - attack.credential_access
  - attack.t1552
logsource:
  product: aiwall
  service: audit
  definition: 'AIWall aiwall.audit.v1 JSON Lines export'
detection:
  selection:
    schema: 'aiwall.audit.v1'
    decision: 'block'
    reason: 'secret-detected'
  condition: selection
falsepositives:
  - Intentional secret-scanner self-tests that intentionally include fake tokens
level: high
